# One file. Lint, test, build one image, deploy both services and the job, all
# pinned to the commit SHA so a rollback is a redeploy of a known tag.
#
# Nothing in here names a particular project or a particular *.run.app host, and
# nothing has to be passed in. Cloud Run publishes a service at
# https://SERVICE-PROJECTNUMBER.REGION.run.app, so the build derives both URLs
# from $PROJECT_NUMBER itself. That matters because the GitHub push trigger runs
# this file with no substitutions at all: any default here is what production
# gets, and a localhost default reached production once already.
substitutions:
  _REGION: asia-southeast1
  # Both default to empty, meaning "derive from $PROJECT_NUMBER and _REGION".
  # They are overrides for a custom domain, not the normal path — and crucially
  # not a localhost default that a trigger build could ship to production.
  _API_URL: ''
  _WEB_ORIGINS: ''

steps:
  - id: lint
    name: python:3.12-slim
    dir: api
    entrypoint: bash
    args:
      - -c
      - pip install --no-cache-dir ruff==0.16.3 && ruff check .

  - id: test
    name: python:3.12-slim
    dir: api
    entrypoint: bash
    args:
      - -c
      - pip install --no-cache-dir -r requirements-dev.txt && python -m pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: api
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:${SHORT_SHA}", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:latest", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api"]

  # Cloud Run answers on two hostnames for the same service — the legacy
  # project-hash form and the newer project-number form. A browser sends the one
  # the user typed, so both web origins have to be allowed or the site is dead
  # for whoever opened the other link. The project-number form is derived here;
  # the legacy one is read back from the deployed service in the final step,
  # because it cannot be computed.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        ORIGINS="${_WEB_ORIGINS}"
        if [ -z "$$ORIGINS" ]; then
          ORIGINS="http://localhost:3000,http://localhost:3111,https://regulens-web-$PROJECT_NUMBER.${_REGION}.run.app"
        fi
        echo "CORS origins: $$ORIGINS"
        gcloud run deploy regulens-api \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:${SHORT_SHA} \
          --region=${_REGION} \
          --service-account=regulens-api@${PROJECT_ID}.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --max-instances=3 \
          --min-instances=1 \
          --memory=1Gi \
          --set-env-vars="^@^CORS_ORIGINS=$$ORIGINS@VERSION=${SHORT_SHA}@SERVICE_NAME=regulens-api@PROJECT_ID=${PROJECT_ID}@GOOGLE_GENAI_USE_VERTEXAI=true@GOOGLE_CLOUD_PROJECT=${PROJECT_ID}@GOOGLE_CLOUD_LOCATION=global@DEBUG_VIEW=true@FAKE_LLM=false" \
          --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,DISCOVERY_API_KEY=gemini-discovery-key:latest \
          --command=uvicorn \
          --args=app.main:app,--host,0.0.0.0,--port,8080 \
          --startup-probe=httpGet.path=/health,initialDelaySeconds=10,timeoutSeconds=10,periodSeconds=10,failureThreshold=12

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - regulens-worker
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=regulens-worker@${PROJECT_ID}.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      # 3 capped the pipeline, not the bill: a document fans out to one push per
      # clause, and the work per clause is short. Cloud Run bills per request
      # and per vCPU-second, so the same clauses cost the same across 10
      # instances as across 3 — they simply stop queueing. The api and web
      # services stay at 3; only the fan-out consumer needed room.
      - --max-instances=10
      # 512Mi is the Cloud Run default and it is not enough here. Observed on
      # 31 Aug: an instance running an ADK extraction while the source sweep
      # held a check lock crossed 526 MiB and was killed mid-sweep. The kill
      # took the lock with it, so the source it was reading kept reporting the
      # previous run's error for hours — a working source that reads as broken.
      # The peak is extraction, not the sweep; both fit in 1Gi.
      - --memory=1Gi
      - --set-env-vars=VERSION=${SHORT_SHA},SERVICE_NAME=regulens-worker,PROJECT_ID=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,DISCOVERY_API_KEY=gemini-discovery-key:latest
      - --command=uvicorn
      - --args=app.worker:app,--host,0.0.0.0,--port,8080
      - --startup-probe=httpGet.path=/health,initialDelaySeconds=10,timeoutSeconds=10,periodSeconds=10,failureThreshold=12

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs describe regulens-job --region=${_REGION} >/dev/null 2>&1 \
          && verb=update || verb=create
        gcloud run jobs $verb regulens-job \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:${SHORT_SHA} \
          --region=${_REGION} \
          --service-account=regulens-api@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars=VERSION=${SHORT_SHA},SERVICE_NAME=regulens-job,PROJECT_ID=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global \
          --command=python \
          --args=-m,app.job,seed

  # Next.js inlines NEXT_PUBLIC_* into the browser bundle at build time, so the
  # API URL cannot be an env var on the running service — it is baked in here,
  # and getting it wrong ships a site that calls localhost from the public web.
  # That happened: this used to read a substitution whose default was localhost,
  # and the GitHub push trigger passes no substitutions.
  - id: build-web
    name: gcr.io/cloud-builders/docker
    dir: web
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        API_URL="${_API_URL}"
        if [ -z "$$API_URL" ]; then
          API_URL="https://regulens-api-$PROJECT_NUMBER.${_REGION}.run.app"
        fi
        echo "web will call: $$API_URL"
        case "$$API_URL" in
          http://localhost*|http://127.0.0.1*)
            echo "REFUSING: a deployed web app cannot call $$API_URL" >&2
            exit 1
            ;;
        esac
        docker build \
          --build-arg=NEXT_PUBLIC_API_URL="$$API_URL" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/web:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/web:latest \
          .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/web

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - regulens-web
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/web:${SHORT_SHA}
      - --region=${_REGION}
      - --allow-unauthenticated
      - --max-instances=3
      - --set-env-vars=VERSION=${SHORT_SHA}
      - --port=8080

  # The legacy project-hash hostname cannot be computed, only read back. Whoever
  # opened that link gets a working site instead of a CORS error.
  - id: allow-real-web-origin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        DERIVED="https://regulens-web-$PROJECT_NUMBER.${_REGION}.run.app"
        ACTUAL="$$(gcloud run services describe regulens-web --region=${_REGION} \
          --format='value(status.url)')"
        echo "derived: $$DERIVED"
        echo "actual:  $$ACTUAL"
        if [ -n "$$ACTUAL" ] && [ "$$ACTUAL" != "$$DERIVED" ]; then
          # gcloud renders a repeated field as a Python-style list, so this
          # arrives as ['a,b,c']. The brackets AND the quotes have to go: a
          # trailing quote makes the last origin `...run.app'`, which no browser
          # Origin header will ever equal, and CORS fails for exactly the host
          # this step exists to allow. That shipped once.
          CURRENT="$$(gcloud run services describe regulens-api --region=${_REGION} \
            --format='value(spec.template.spec.containers[0].env.filter("name:CORS_ORIGINS").extract("value"))' \
            | tr -d "[]'\"")"
          case "$$CURRENT" in
            *"$$ACTUAL"*) echo "already allowed" ;;
            *)
              gcloud run services update regulens-api --region=${_REGION} \
                --update-env-vars="^@^CORS_ORIGINS=$$CURRENT,$$ACTUAL"
              echo "added $$ACTUAL"
              ;;
          esac
        fi

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/regulens/api:latest

options:
  logging: CLOUD_LOGGING_ONLY
  # Default e2-standard-2 is the only machine type the 2,500 build-minute free
  # tier applies to. E2_HIGHCPU_8 gets none of it and billed every minute.
